hero:
  title:
    firstLine: Keep your hands
    secondLine: on the
    emphasis: keyboard
  description: Open apps and files, get an answer, grab an emoji, or run a Shortcut. Your mouse can sit this one out.
  screenshotAlt: Conjuror launcher screenshot placeholder
  hotkey:
    label: Option Space
    keys:
      - ⌥
      - Space
modes:
  title:
    prefix: Four modes, one
    key: tab
    suffix: apart.
  descriptionHTML: Press <kbd>Tab</kbd> to cycle through Apps, Shortcuts, Emoji, and Files. When you land on the one you want, just start typing.
  screenshotAlt: Conjuror mode switcher screenshot placeholder
  items:
    - name: Apps
      description: Open an app or type a calculation.
    - name: Shortcuts
      description: Find a Shortcut and run it.
    - name: Emoji
      description: Search, choose, and copy.
    - name: Files
      description: Find a file or folder and open it.
launch:
  title:
    firstLine: Type it.
    emphasis: Launch
    suffix: it.
  descriptionHTML: Press <kbd>⌥ + Space</kbd>, type the app you’re after. Hit <kbd>Return</kbd> and you’re off.
  screenshotAlt: Conjuror application search screenshot placeholder
files:
  title:
    firstLine: Pick a file.
    emphasis: Any
    suffix: file.
  descriptionHTML: Type <kbd>/</kbd>, search by name, and press <kbd>Return</kbd>. Files and folders indexed by Spotlight, without leaving the keyboard.
  screenshotAlt: Conjuror file and folder search screenshot placeholder
calculate:
  title:
    emphasis: Calculate
    secondLine: Copy the result.
  descriptionHTML: Type what you want to work out. Hit <kbd>Return</kbd> to copy the answer.
  screenshotAlt: Conjuror calculator screenshot placeholder
  examples:
    - label: Arithmetic
      input: 2 plus 3 times 4
      output: "14"
    - label: Percentages
      input: 123 + 25% + 10%
      output: "169.125"
    - label: Functions
      input: sqrt 9 + abs(-5)
      output: "8"
    - label: Units
      input: 10 km to miles
      output: 6.21371 mi
    - label: Temperature
      input: 30 °C to °F
      output: 86 °F
    - label: Data
      input: 1 GiB to MiB
      output: 1024 MiB
    - label: Number bases
      input: 255 to hex
      output: "0xFF"
    - label: Relative dates
      input: 5 days from now
    - label: Timezones
      input: 9am GMT
      output: PDT
    - label: Currencies
      input: 100 USD to EUR
emoji:
  title:
    firstLine: Pick an emoji.
    emphasis: Any
    suffix: emoji.
  descriptionHTML: Press <kbd>⌥ + ⇧ + E</kbd>, search by name, and hit <kbd>Return</kbd> to copy.
  screenshotAlt: Conjuror emoji picker screenshot placeholder
  decorations:
    - symbol: ✨
      class: emoji-one
    - symbol: 🥳
      class: emoji-two
    - symbol: 🎉
      class: emoji-three
shortcuts:
  title:
    firstLine: Shortcuts.
    secondLine: Up your
    emphasis: sleeve
  descriptionHTML: Press <kbd>⌥ + ⇧ + Space</kbd> to open Shortcuts mode. Search by name and press <kbd>Return</kbd> to run.
  screenshotAlt: Conjuror Apple Shortcuts screenshot placeholder
closing:
  title:
    firstLine: Less pointing.
    emphasis: More doing.
