hero:
  title:
    firstLine: Keep your hands
    secondLine: on the
    emphasis: keyboard
  description: Open apps and files, get an answer, grab an emoji, or run a Shortcut. Your mouse can sit this one out.
  screenshot: /images/screenshots/apps.webp
  screenshotAlt: Conjuror showing applications matching “cal” with Calculator selected
  hotkey:
    label: Option Space
    keys:
      - ⌥
      - Space
modes:
  title:
    prefix: Four modes, one
    key: tab
    suffix: apart.
  descriptionHTML: Press <kbd>Tab</kbd> to cycle through Apps, Shortcuts, Emoji, and Files. When you land on the one you want, just start typing.
  items:
    - name: Apps
      description: Open an app or type a calculation.
      screenshot: /images/screenshots/mode-apps.webp
      screenshotAlt: Conjuror in Apps mode
    - name: Shortcuts
      description: Find a Shortcut and run it.
      screenshot: /images/screenshots/mode-shortcuts.webp
      screenshotAlt: Conjuror in Shortcuts mode
    - name: Emoji
      description: Search, choose, and copy.
      screenshot: /images/screenshots/mode-emoji.webp
      screenshotAlt: Conjuror in Emoji mode
    - name: Files
      description: Find a file or folder and open it.
      screenshot: /images/screenshots/mode-files.webp
      screenshotAlt: Conjuror in Files mode
launch:
  title:
    firstLine: Type it.
    emphasis: Launch
    suffix: it.
  descriptionHTML: Press <kbd>⌥ + Space</kbd>, type the app you’re after. Hit <kbd>Return</kbd> and you’re off.
  screenshot: /images/screenshots/apps.webp
  screenshotAlt: Conjuror showing applications matching “cal” with Calculator selected
files:
  title:
    firstLine: Pick a file.
    emphasis: Any
    suffix: file.
  descriptionHTML: Type <kbd>/</kbd>, search by name, and press <kbd>Return</kbd>. Files and folders indexed by Spotlight, without leaving the keyboard.
  screenshot: /images/screenshots/files.webp
  screenshotAlt: Conjuror showing PDF files matching “Four Against”
calculate:
  title:
    emphasis: Calculate
    secondLine: Copy the result.
  descriptionHTML: Type what you want to work out. Hit <kbd>Return</kbd> to copy the answer.
  screenshot: /images/screenshots/calculator-conversion.webp
  screenshotAlt: Conjuror converting 10 kilometres to miles
  examples:
    - label: Arithmetic
      input: 2 plus 3 times 4
      output: "14"
    - label: Percentages
      input: 123 + 25% + 10%
      output: "169.125"
    - label: Functions
      input: sqrt 9 + abs(-5)
      output: "8"
    - label: Units
      input: 10 km to miles
      output: 6.21371 mi
    - label: Temperature
      input: 30 °C to °F
      output: 86 °F
    - label: Data
      input: 1 GiB to MiB
      output: 1024 MiB
    - label: Number bases
      input: 255 to hex
      output: "0xFF"
    - label: Relative dates
      input: 5 days from now
    - label: Timezones
      input: 9am GMT
      output: PDT
    - label: Currencies
      input: 100 USD to EUR
emoji:
  title:
    firstLine: Say it with an
    emphasis: emoji.
  descriptionHTML: Press <kbd>⌥ + ⇧ + E</kbd>, search by name, and hit <kbd>Return</kbd> to copy.
  screenshot: /images/screenshots/emoji.webp
  screenshotAlt: Conjuror Emoji mode showing results for “party”
  decorations:
    - symbol: ✨
      class: emoji-one
    - symbol: 🥳
      class: emoji-two
    - symbol: 🎉
      class: emoji-three
shortcuts:
  title:
    firstLine: Shortcuts.
    secondLine: Up your
    emphasis: sleeve
  descriptionHTML: Press <kbd>⌥ + ⇧ + Space</kbd> to open Shortcuts mode. Search by name and press <kbd>Return</kbd> to run.
  screenshot: /images/screenshots/shortcuts.webp
  screenshotAlt: Conjuror showing available Apple Shortcuts
closing:
  title:
    firstLine: Less pointing.
    emphasis: More doing.
