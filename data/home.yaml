hero:
  category: A keyboard-first launcher for macOS
  title:
    firstLine: Keep your hands
    secondLine: on the
    emphasis: keyboard
  description: Open apps, find files, calculate answers, and run Apple Shortcuts—all from your keyboard.
  screenshot: /images/screenshots/apps.webp
  screenshotAlt: Conjuror showing applications matching “cal” with Calculator selected
  instructionsHTML: Press <kbd>⌥ Space</kbd>, type an app, then <kbd>Return</kbd> to launch.
modes:
  title:
    prefix: Four modes, one
    key: tab
    suffix: apart.
  descriptionHTML: Open apps and System Settings, with recent launches helping to order similar matches. Press <kbd>Tab</kbd> to switch to Shortcuts, Emoji, or Files.
  items:
    - name: Apps
      description: Open apps, find settings, or calculate.
      screenshot: /images/screenshots/mode-apps.webp
      screenshotAlt: Conjuror in Apps mode
    - name: Shortcuts
      description: Find a Shortcut and run it.
      screenshot: /images/screenshots/mode-shortcuts.webp
      screenshotAlt: Conjuror in Shortcuts mode
    - name: Emoji
      description: Search, choose, and copy.
      screenshot: /images/screenshots/mode-emoji.webp
      screenshotAlt: Conjuror in Emoji mode
    - name: Files
      description: Find a file or folder and open it.
      screenshot: /images/screenshots/mode-files.webp
      screenshotAlt: Conjuror in Files mode
files:
  title:
    firstLine: Your files.
    emphasis: A few keys
    suffix: away.
  descriptionHTML: Find files without the exact filename. Type <kbd>/</kbd>, enter what you remember, and press <kbd>Return</kbd> to open a match from your Spotlight index.
  screenshot: /images/screenshots/files.webp
  screenshotAlt: Conjuror showing PDF files matching “Four Against”
calculate:
  title:
    emphasis: Calculate
    secondLine: Copy the result.
  descriptionHTML: Work out a percentage or convert a measurement without opening another app. Type your calculation, then press <kbd>Return</kbd> to copy the answer.
  screenshot: /images/screenshots/calculator-conversion.webp
  screenshotAlt: Conjuror converting 10 kilometres to miles
  examples:
    - label: Percentages
      input: 20% of 50
      output: "10"
    - label: Distance
      input: 10 km to miles
      output: ≈ 6.21 mi
    - label: Temperature
      input: 30 °C to °F
      output: 86 °F
emoji:
  title:
    firstLine: Think of an emoji.
    emphasis: Presto.
  descriptionHTML: Find the emoji you mean with everyday words like “lol”. Type <kbd>:</kbd> to search, then press <kbd>Return</kbd> to copy.
  screenshot: /images/screenshots/emoji.webp
  screenshotAlt: Conjuror Emoji mode showing results for “party”
shortcuts:
  title:
    firstLine: Shortcuts.
    secondLine: Up your
    emphasis: sleeve
  descriptionHTML: Keep your favourite Apple Shortcuts close at hand. Type <kbd>&gt;</kbd>, search by name, and press <kbd>Return</kbd> to run.
  screenshot: /images/screenshots/shortcuts.webp
  screenshotAlt: Conjuror showing available Apple Shortcuts
privacy:
  title: Your searches stay on your Mac.
  description: Find apps and files, choose emoji, and calculate answers locally. No account needed.
  detail: Currency conversion is optional. It downloads exchange rates, never your search text.
closing:
  title:
    firstLine: Less pointing.
    emphasis: More doing.
