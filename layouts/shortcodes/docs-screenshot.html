{{ $src := .Get "src" }}
{{ $config := imageConfig (path.Join "static" $src) }}
<figure class="docs-screenshot">
  <img src="{{ $src | relURL }}" alt="{{ .Get "alt" }}" width="{{ $config.Width }}" height="{{ $config.Height }}" loading="lazy">
  {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
