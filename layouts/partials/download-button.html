    {{ else if .icon }}
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14"/></svg>
    {{ end }}
    {{ .label | default "Download for macOS" }}
  </a>
  <span class="download-status">✦ Alpha</span>
</span>
